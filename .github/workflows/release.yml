name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Fine-grained token with contents:write on homebrew-tap and scoop-bucket.
      # Without it the release is skipped: publish from a maintainer machine instead.
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - if: env.PACKAGES_TOKEN == ''
        run: echo "::notice::PACKAGES_TOKEN not set; skipping CI release."
      - if: env.PACKAGES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: env.PACKAGES_TOKEN != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: env.PACKAGES_TOKEN != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
