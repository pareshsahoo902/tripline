name: Feature request
description: A new rule, a new agent to support, or a change to an existing command
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong in a real session that tripline should have caught or explained?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: false
